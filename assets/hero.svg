<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">ZerxLab</title>
  <desc id="d">ZerxLab — an independent open-source lab crafting fast, beautiful tools with Rust, Go and TypeScript.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#06b6d4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="1" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <mask id="gridMask">
      <rect width="1000" height="340" fill="url(#fade)"/>
    </mask>
    <clipPath id="card">
      <rect width="1000" height="340" rx="22"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; font-style: italic; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .breathe { animation: breathe 7s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .scan { animation: scan 6s linear infinite; }
      .rise { animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both; }
      .rise2 { animation: rise 1.2s .15s cubic-bezier(.2,.7,.2,1) both; }
      .rise3 { animation: rise 1.2s .3s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      @keyframes breathe { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes scan { 0% { transform: translateX(-260px) } 100% { transform: translateX(1260px) } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <rect width="1000" height="340" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect class="breathe" width="1000" height="340" fill="url(#glow)"/>
    <rect width="1000" height="340" fill="url(#glow2)"/>
    <rect class="scan" x="0" y="0" width="220" height="1.5" fill="url(#accent)" opacity="0.7"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="339" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- top bar -->
  <g class="mono" font-size="12.5" fill="#94a3b8">
    <circle class="pulse" cx="38" cy="36" r="4" fill="#22c55e"/>
    <text x="52" y="40" letter-spacing="2.2">ZERXLAB · INDEPENDENT SOFTWARE LAB</text>
    <text x="962" y="40" text-anchor="end" letter-spacing="1.2" fill="#64748b">zerx.dev</text>
  </g>

  <!-- title -->
  <g text-anchor="middle">
    <text class="sans rise" x="500" y="150" font-size="84" font-weight="700" letter-spacing="-3" fill="#f8fafc">ZerxLab</text>
    <text class="serif rise2" x="500" y="198" font-size="34" fill="url(#accent)">Crafting tools that feel instant.</text>
    <text class="sans rise3" x="500" y="236" font-size="16" fill="#94a3b8" letter-spacing="1">一个人的开源实验室 · 用 Rust / Go / TypeScript 打造又快又好看的工具</text>
  </g>

  <!-- terminal prompt -->
  <g class="mono" font-size="13.5">
    <text x="38" y="300" fill="#64748b">~/lab</text>
    <text x="86" y="300" fill="#22d3ee">❯</text>
    <text x="102" y="300" fill="#cbd5e1">cargo desktop-dev</text>
    <rect class="cursor" x="246" y="289" width="8" height="15" fill="#22d3ee"/>
  </g>

  <!-- segmented download, a nod to FluxDown -->
  <g transform="translate(662 286)">
    <text class="mono" x="0" y="-8" font-size="11" fill="#64748b" letter-spacing="1">8 SEGMENTS · 98.7 MB/s</text>
    <rect x="0" y="0" width="300" height="6" rx="3" fill="#ffffff" fill-opacity="0.07"/>
    <g fill="url(#bar)">
      <rect x="0" y="0" height="6" rx="3" width="34"><animate attributeName="width" values="0;34;34" keyTimes="0;.55;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="38" y="0" height="6" rx="3" width="34"><animate attributeName="width" values="0;34;34" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="76" y="0" height="6" rx="3" width="34"><animate attributeName="width" values="0;34;34" keyTimes="0;.45;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="114" y="0" height="6" rx="3" width="34"><animate attributeName="width" values="0;34;34" keyTimes="0;.8;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="152" y="0" height="6" rx="3" width="34"><animate attributeName="width" values="0;34;34" keyTimes="0;.6;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="190" y="0" height="6" rx="3" width="34"><animate attributeName="width" values="0;34;34" keyTimes="0;.5;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="228" y="0" height="6" rx="3" width="34"><animate attributeName="width" values="0;34;34" keyTimes="0;.75;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="266" y="0" height="6" rx="3" width="34"><animate attributeName="width" values="0;34;34" keyTimes="0;.65;1" dur="4s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
